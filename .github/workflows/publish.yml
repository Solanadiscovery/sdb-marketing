# Pubblica da solo, nel cloud di GitHub (gratis): ogni 30 minuti controlla se c'è un contenuto (post o storia) da pubblicare.
# Unico segreto necessario: IG_ACCESS_TOKEN (Settings > Secrets and variables > Actions). Senza token non fa nulla.
# Al primo avvio verifica tutto senza pubblicare; poi rinnova il token ogni settimana e avvisa (email) se qualcosa non va.
name: Pubblica su Instagram
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: instagram-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pubblica il prossimo contenuto in scadenza
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ]; then echo "Configurazione incompleta: manca il segreto IG_ACCESS_TOKEN. Nessuna azione."; exit 0; fi
          python -m mkt publish --live
      - name: Salva calendario e stato
        if: always()
        run: |
          git config user.name "sdb-marketing"
          git config user.email "actions@users.noreply.github.com"
          for f in plan.json state.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Aggiorna calendario e stato"
          for i in 1 2 3; do
            if git pull --rebase --quiet origin main && git push origin HEAD:main; then exit 0; fi
            sleep 10
          done
          exit 1
