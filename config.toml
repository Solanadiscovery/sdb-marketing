# Campagna Instagram di Solana DEX Discovery. Non tocca il VPS né il bot Telegram.
language = "en"                 # "it" o "en": lingua dei post di questo profilo
timezone = "Europe/Rome"
post_days = ["mon", "wed", "fri"]   # giorni di pubblicazione
post_time = "18:30"             # ora locale del carosello nel feed
story_time = "12:30"            # storia dello stesso giorno ("oggi nel feed")
max_late_hours = 36             # un post non pubblicato entro questo ritardo viene saltato, mai recuperato in blocco
graph_version = "v23.0"         # versione della Graph API (cambia raramente; aggiornala se Meta la ritira)
brand = "Solana DEX Discovery"
cta = "Link in bio"             # le didascalie di Instagram non hanno link cliccabili
